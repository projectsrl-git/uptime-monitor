<div class="d-flex justify-content-center mb-2">

    <div class="btn-group btn-group-sm stats-period" role="group">

        <button
            type="button"
            class="btn active statistics-period"
            data-period="24h">
            24 ore
        </button>

        <button
            type="button"
            class="btn statistics-period"
            data-period="7d">
            7 giorni
        </button>

        <button
            type="button"
            class="btn statistics-period"
            data-period="30d">
            30 giorni
        </button>

        <button
            type="button"
            class="btn statistics-period"
            data-period="365d">
            365 giorni
        </button>

    </div>

</div>

<!-- sommario -->
<div class="card shadow-sm mb-4">
    <div class="card-header">
        <h5 class="mb-0">
            Sommario
        </h5>
    </div>

    <div class="card-body">
        <div class="row text-center">

            <div class="col-md-3 border-end">
                <div class="text-muted small">
                    Uptime
                </div>

                <div id="uptime-percentage" class="fw-semibold mt-1">
                    -
                </div>
            </div>

            <div class="col-md-3 border-end">
                <div class="text-muted small">
                    Downtime
                </div>

                <div id="downtime" class="fw-semibold mt-1">
                    -
                </div>
            </div>

            <div class="col-md-3 border-end">
                <div class="text-muted small">
                    Check
                </div>

                <div id="checks" class="fw-semibold mt-1">
                    -
                </div>
            </div>

            <div class="col-md-3">
                <div class="text-muted small">
                    Incidenti
                </div>

                <div id="incidents" class="fw-semibold mt-1">
                    -
                </div>
            </div>

        </div>
    </div>
</div>


<!-- response time -->
<div class="card shadow-sm mb-4">
    <div class="card-header">
        <h5 class="mb-0">
            Response time
        </h5>
    </div>

    <div class="card-body">
        <div class="row text-center">

            <div class="col-md-4 border-end">
                <div class="text-muted small">
                    Minimo
                </div>

                <div id="response-time-min" class="fw-semibold mt-1">
                    -
                </div>
            </div>

            <div class="col-md-4 border-end">
                <div class="text-muted small">
                    Medio
                </div>

                <div id="response-time-average" class="fw-semibold mt-1">
                    -
                </div>
            </div>

            <div class="col-md-4">
                <div class="text-muted small">
                    Massimo
                </div>

                <div id="response-time-max" class="fw-semibold mt-1">
                    -
                </div>
            </div>

        </div>
    </div>
</div>


<!-- uptime nel tempo -->
<div class="card shadow-sm mb-4">
    <div class="card-header">
        <h5 class="mb-0">
            Uptime nel tempo
        </h5>
    </div>

    <div class="card-body">
        <div style="height: 300px;">
            <canvas id="uptime-chart"></canvas>
        </div>
    </div>
</div>


<!-- response time nel tempo -->
<div class="card shadow-sm mb-4">

</div>
