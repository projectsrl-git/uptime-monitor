{% extends "base.html" %}
{% load static %}

{% block navbar %}
{% endblock %}

{% block title %}
Monitor Status
{% endblock %}

{% block content %}

<div class="container-fluid px-4 py-3">

    <!-- HEADER -->
    <div class="text-center mb-4">

        <h2
            id="status-title"
            class="fw-semibold mb-1">
            Caricamento...
        </h2>

        <div
            id="status-summary"
            class="status-summary mb-4">
            Caricamento stato sistemi...
        </div>

        <div class="row justify-content-center g-2 mb-4">

            <div class="col-6 col-sm-3">
                <div class="monitor-status-uptime-card text-center">
                    <div class="monitor-status-uptime-label">
                        24 ore
                    </div>

                    <div
                        id="uptime-24h"
                        class="monitor-status-uptime-value">
                        -
                    </div>
                </div>
            </div>

            <div class="col-6 col-sm-3">
                <div class="monitor-status-uptime-card text-center">
                    <div class="monitor-status-uptime-label">
                        7 giorni
                    </div>

                    <div
                        id="uptime-7d"
                        class="monitor-status-uptime-value">
                        -
                    </div>
                </div>
            </div>

            <div class="col-6 col-sm-3">
                <div class="monitor-status-uptime-card text-center">
                    <div class="monitor-status-uptime-label">
                        30 giorni
                    </div>

                    <div
                        id="uptime-30d"
                        class="monitor-status-uptime-value">
                        -
                    </div>
                </div>
            </div>

            <div class="col-6 col-sm-3">
                <div class="monitor-status-uptime-card text-center">
                    <div class="monitor-status-uptime-label">
                        365 giorni
                    </div>

                    <div
                        id="uptime-365d"
                        class="monitor-status-uptime-value">
                        -
                    </div>
                </div>
            </div>

        </div>

    </div>


    <!-- PERIODO -->
    <div class="d-flex justify-content-center mb-4">

        <div
            class="btn-group stats-period monitor-status-period"
            role="group">

            <button
                type="button"
                class="btn active statistics-period"
                data-period="24h">
                24 ore
            </button>

            <button
                type="button"
                class="btn statistics-period"
                data-period="7d">
                7 giorni
            </button>

            <button
                type="button"
                class="btn statistics-period"
                data-period="30d">
                30 giorni
            </button>

            <button
                type="button"
                class="btn statistics-period"
                data-period="365d">
                365 giorni
            </button>

        </div>

    </div>


    <!-- MONITOR -->
    <div
        id="monitor-status-list"
        class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-2">
    </div>

</div>

{% endblock %}

{% block javascript %}
<script src="{% static 'js/monitor_status.js' %}"></script>
{% endblock %}
