{% extends "base.html" %}
{% load static %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Uptime Monitor</h1>

        <button class="btn btn-primary">
            Nuovo Monitor
        </button>
    </div>

    <div class="row">
        <!-- Lista monitor -->
        <div class="col-lg-8">
            <div id="monitor-list">
                Caricamento monitor...
            </div>
        </div>

        <!-- Statistiche -->
        <div class="col-lg-4">
            <div class="card shadow-sm sticky-top" style="top:20px;">
                <div class="card-header">
                    <h5 class="mb-0">Overview</h5>
                </div>

                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span>Totali</span>
                        <h5 id="total-monitors" class="mb-0">-</h5>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="text-success">UP</span>
                        <h5 id="up-monitors" class="mb-0 text-success">-</h5>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="text-danger">DOWN</span>
                        <h5 id="down-monitors" class="mb-0 text-danger">-</h5>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-warning">PAUSED</span>
                        <h5 id="paused-monitors" class="mb-0 text-warning">-</h5>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-muted">NOT STARTED</span>
                        <h5 id="not-started-monitors" class="mb-0 text-muted">-</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<template id="monitor-card-template">
    <div class="card mb-2 shadow-sm">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">

                <div class="flex-grow-1">
                    <!-- nome + badge -->
                    <div class="d-flex align-items-center">
                        <h5 class="monitor-name me-2 mb-1"></h5>
                        <span class="badge monitor-status"></span>
                        <!-- URL -->
                        <p class="monitor-url text-secondary mb-0 small"></p>
                    </div>

                    <!-- uptime 2h-->
                    <p class="monitor-uptime text-muted small mb-0">
                        Uptime: caricamento...
                    </p>                
                </div>

                <div class="d-flex align-items-end">
                    <!-- intervallo -->
                    <small class="monitor-interval text-muted fst-italic"></small>
                </div>

            </div>
        </div>
    </div>
</template>

{% endblock %}

{% block javascript %}
<script src="{% static 'js/home.js' %}"></script>
{% endblock %}
